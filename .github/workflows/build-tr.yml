name: Build Lyrisland-TR

on:
  push:
    branches: [lyrisland-tr]

permissions:
  contents: write

concurrency:
  group: build-tr
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Lyrisland.xcodeproj \
            -scheme LyrislandTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1

      - name: Build Release (universal)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Lyrisland.xcodeproj \
            -scheme Lyrisland \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1

      - name: Sign (ad-hoc) and package
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          APP="build/Build/Products/Release/Lyrisland.app"
          codesign --force --deep --sign - --options runtime \
            --entitlements Sources/App/Lyrisland.entitlements "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/Lyrisland"
          swift Scripts/generate-dmg-background.swift /tmp/dmg-background.png 660 400 || true
          BG=""; [ -f /tmp/dmg-background.png ] && BG="--background /tmp/dmg-background.png"
          create-dmg --volname "Lyrisland" $BG \
            --window-pos 200 120 --window-size 660 400 --icon-size 80 \
            --icon "Lyrisland.app" 170 190 --app-drop-link 490 190 \
            --hide-extension "Lyrisland.app" --no-internet-enable \
            "Lyrisland-TR.dmg" "$APP" || test $? -eq 2
          ditto -c -k --keepParent "$APP" "Lyrisland-TR.zip"

      - name: Publish results to lyrisland-dist branch
        if: always()
        run: |
          mkdir -p out
          for f in Lyrisland-TR.dmg Lyrisland-TR.zip; do if [ -f "$f" ]; then cp "$f" out/; fi; done
          for log in test build; do
            if [ -f $log.log ]; then
              grep -E "error:|warning: .*Sources/|✘|✔|Test run|\*\* .* \*\*|Suite .* (passed|failed)" $log.log | head -400 > out/$log-summary.txt || true
              tail -150 $log.log > out/$log-tail.txt
            fi
          done
          echo "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} package=${{ steps.package.outcome }} sha=${{ github.sha }}" > out/STATUS.txt
          cd out
          git init -q -b lyrisland-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lyrisland-dist
